<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Water Quality</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-database-compat.js"></script>
  <!-- Leaflet CSS & JS + Leaflet.heat -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
    }
    header {
      background: #26334d;
      color: #fff;
      padding: 1.5rem 1rem 1rem 1rem;
      text-align: center;
      position: relative;
      box-shadow: 0 2px 8px #0002;
    }
    #logoutBtn {
      position: absolute;
      right: 20px;
      top: 22px;
      background: #d32f2f;
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 2px 8px #0001;
    }
    .content {
      padding: 2rem 2.5rem;
      max-width: 1200px;
      margin: auto;
    }
    .section-title {
      color: #26334d;
      font-size: 1.3rem;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      border-left: 5px solid #0077b6;
      padding-left: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .report-list {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin-bottom: 2rem;
    }
    .report-card {
      background: #fff;
      padding: 1rem 1.3rem;
      border-radius: 10px;
      box-shadow: 0 2px 12px #0077b622;
      min-width: 260px;
      max-width: 340px;
      flex: 1 1 260px;
      border-left: 5px solid #ffc107;
      font-size: 1rem;
      color: #26334d;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .report-card.verified {
      border-left: 5px solid #43a047;
      background: #f1fbe7;
    }
    .verify-btn {
      background: #0077b6;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 0.5rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .verify-btn:hover {
      background: #005b8a;
    }
    .map-toggle-group {
      display: flex;
      gap: 1.2rem;
      margin: 2.5rem 0 1.2rem 0;
      justify-content: center;
    }
    .map-toggle-btn {
      background: #26334d;
      color: #fff;
      border: none;
      border-radius: 8px 8px 0 0;
      padding: 0.8rem 2.2rem;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      box-shadow: 0 2px 8px #0001;
      outline: none;
    }
    .map-toggle-btn.active, .map-toggle-btn:focus {
      background: #0077b6;
      color: #fff;
    }
    .map-section {
      display: none;
      width: 100%;
    }
    .map-section.active {
      display: block;
    }
    #heatmap, #reportMap {
      width: 100%;
      height: 420px;
      border: 2px solid #0077b6;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 2px 12px #0077b622;
      margin-bottom: 2rem;
    }
    /* Legend styling */
    .legend {
      background: white;
      padding: 10px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .legend h4 {
      margin: 0 0 8px 0;
      font-weight: 700;
      color: #1e3b4f;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .color-box {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid #ccc;
    }
    .marker-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }
    .marker-icon-small {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #555;
    }
    @media (max-width: 700px) {
      .content { padding: 1rem; }
      .report-list { flex-direction: column; }
      #heatmap, #reportMap { height: 300px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🛡️ Admin Panel - Water Monitoring</h1>
    <button id="logoutBtn" onclick="logout()">Logout</button>
  </header>

  <div class="content">
    <div class="map-toggle-group">
      <button class="map-toggle-btn active" id="btn-heatmap" onclick="showMap('heatmap')">Sensor Heatmap</button>
      <button class="map-toggle-btn" id="btn-reportmap" onclick="showMap('reportMap')">Reports Map</button>
    </div>
    <div id="heatmap-section" class="map-section active">
      <div id="heatmap"></div>
    </div>
    <div id="reportMap-section" class="map-section">
      <div id="reportMap"></div>
    </div>

    <div class="section-title">Pending Complaints</div>
    <div id="pendingComplaints" class="report-list"></div>

    <div class="section-title">Approved Complaints</div>
    <div id="approvedComplaints" class="report-list"></div>
  </div>

  <button 
    onclick="window.location.href='upload_check.html'" 
    style="
      position: fixed;
      bottom: 24px;
      right: 32px;
      background: #0077b6;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 1rem 2.2rem;
      font-size: 1.15rem;
      font-weight: 700;
      box-shadow: 0 4px 16px #0077b655;
      cursor: pointer;
      z-index: 1000;
      transition: background 0.2s;
    "
    onmouseover="this.style.background='#005b8a'"
    onmouseout="this.style.background='#0077b6'"
  >
    ➕ Upload/Check Data
  </button>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCB4O8j33O3MvstmRPDxaIRA16hBLEWszA",
      authDomain: "phmonitor-c7b10.firebaseapp.com",
      databaseURL: "https://phmonitor-c7b10-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "phmonitor-c7b10"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {
      if (!user || user.email !== 'admin@phmonitor.com') {
        window.location.href = 'login.html';
      }
    });

    function logout() {
      auth.signOut().then(() => {
        window.location.href = 'login.html';
      });
    }

    // --- Report Listing ---
    function loadReports() {
      db.ref('reports').on('value', snapshot => {
        const reports = snapshot.val();
        const pendingContainer = document.getElementById('pendingList');
        const verifiedContainer = document.getElementById('verifiedList');
        if (pendingContainer) pendingContainer.innerHTML = '';
        if (verifiedContainer) verifiedContainer.innerHTML = '';
        if (!reports) return;

        Object.entries(reports).forEach(([key, r]) => {
          const card = document.createElement('div');
          card.className = 'report-card' + (r.status === 'verified' ? ' verified' : '');
          card.innerHTML = `
            <strong>Comment:</strong> ${r.comment}<br>
            <strong>Guess:</strong> ${r.guessed}<br>
            <strong>Lat:</strong> ${r.lat}, <strong>Lng:</strong> ${r.lng}<br>
            <strong>Status:</strong> ${r.status}
            ${r.status !== 'verified' ? `<button class="verify-btn" onclick="verifyReport('${key}')">Mark as Verified</button>` : ''}
          `;
          if (r.status === 'verified') {
            if (verifiedContainer) verifiedContainer.appendChild(card);
          } else {
            if (pendingContainer) pendingContainer.appendChild(card);
          }
        });
      });
    }

    function verifyReport(id) {
      db.ref('reports/' + id).update({ status: 'verified' });
    }

    // --- Complaint Listing & Actions ---
    function loadComplaints() {
      db.ref('complaints').on('value', snapshot => {
        const complaints = snapshot.val();
        const pendingDiv = document.getElementById('pendingComplaints');
        const approvedDiv = document.getElementById('approvedComplaints');
        pendingDiv.innerHTML = '';
        approvedDiv.innerHTML = '';
        if (!complaints) return;

        Object.entries(complaints).forEach(([key, c]) => {
          const card = document.createElement('div');
          card.className = 'report-card' + (c.status === 'approved' ? ' verified' : '');
          card.innerHTML = `
            <strong>Name:</strong> ${c.name || '-'}<br>
            <strong>Location:</strong> ${c.location || '-'}<br>
            ${c.lat && c.lng ? `<strong>Lat:</strong> ${c.lat}, <strong>Lng:</strong> ${c.lng}<br>` : ''}
            <strong>pH:</strong> ${c.ph ?? '-'}<br>
            <strong>TDS:</strong> ${c.tds ?? '-'}<br>
            <strong>Issue:</strong> ${c.issue}<br>
            <strong>Description:</strong> ${c.description}<br>
            <strong>Status:</strong> ${c.status}
            ${c.status !== 'approved' ? `
              <button class="verify-btn" onclick="approveComplaint('${key}')">Approve</button>
              <button class="verify-btn" style="background:#d32f2f;" onclick="discardComplaint('${key}')">Discard</button>
            ` : ''}
          `;
          if (c.status === 'approved') {
            approvedDiv.appendChild(card);
          } else {
            pendingDiv.appendChild(card);
          }
        });
      });
    }

    function approveComplaint(id) {
      db.ref('complaints/' + id).update({ status: 'approved' });
    }
    function discardComplaint(id) {
      db.ref('complaints/' + id).remove();
    }

    // --- Map Toggle ---
    function showMap(which) {
      document.getElementById('heatmap-section').classList.remove('active');
      document.getElementById('reportMap-section').classList.remove('active');
      document.getElementById('btn-heatmap').classList.remove('active');
      document.getElementById('btn-reportmap').classList.remove('active');
      if (which === 'heatmap') {
        document.getElementById('heatmap-section').classList.add('active');
        document.getElementById('btn-heatmap').classList.add('active');
        // Invalidate size when switching to heatmap
        setTimeout(() => {
          if (heatmapMap) heatmapMap.invalidateSize();
        }, 100);
      } else {
        document.getElementById('reportMap-section').classList.add('active');
        document.getElementById('btn-reportmap').classList.add('active');
        // Invalidate size when switching to report map
        setTimeout(() => {
          if (reportMapInstance) reportMapInstance.invalidateSize();
        }, 100);
      }
    }

    // --- Sensor Heatmap (Leaflet) ---
    let heatmapMap, heatmapLayer;
    function initHeatmap() {
      heatmapMap = L.map('heatmap', {
        center: [22.9734, 78.6569],
        zoom: 5,
        zoomControl: true
      });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(heatmapMap);

      // Add legend for heatmap
      const heatLegend = L.control({ position: 'bottomright' });
      heatLegend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML = `
          <h4>pH Heatmap</h4>
          <div class="legend-item">
            <div class="color-box" style="background: red;"></div>
            <span>Poor (Acidic / Alkaline)</span>
          </div>
          <div class="legend-item">
            <div class="color-box" style="background: yellow;"></div>
            <span>Moderate</span>
          </div>
          <div class="legend-item">
            <div class="color-box" style="background: lime;"></div>
            <span>Good (Neutral pH)</span>
          </div>
        `;
        return div;
      };
      heatLegend.addTo(heatmapMap);

      const ref = db.ref("sensors");
      ref.once("value", snapshot => {
        const data = snapshot.val();
        if (!data) return;

        const heatArray = [];
        Object.entries(data).forEach(([locationKey, sensor]) => {
          const lat = parseFloat(sensor.latitude);
          const lng = parseFloat(sensor.longitude);
          const pH = parseFloat(sensor.ph);

          if (isNaN(lat) || isNaN(lng)) return;

          // Weight: 0 (bad pH) to 1 (good pH)
          let weight;
          if (pH <= 7.5) {
            weight = (pH - 4) / (7.5 - 4);
          } else {
            weight = (10 - pH) / (10 - 7.5);
          }
          weight = Math.max(0, Math.min(1, weight));

          heatArray.push([lat, lng, weight]);
        });

        if (heatArray.length === 0) return;

        heatmapLayer = L.heatLayer(heatArray, {
          radius: 35,
          blur: 20,
          maxZoom: 12,
          max: 1.0,
          gradient: {
            0.0: 'red',
            0.5: 'yellow',
            1.0: 'lime'
          },
          minOpacity: 0.25
        }).addTo(heatmapMap);

        // Fit bounds to show all points
        const bounds = heatArray.map(p => [p[0], p[1]]);
        heatmapMap.fitBounds(bounds, { padding: [40, 40], maxZoom: 7 });
      });
    }

    // --- Reports Map (Leaflet with markers) ---
    let reportMapInstance;
    let reportMarkersLayer, complaintMarkersLayer;
    
    function initReportMap() {
      reportMapInstance = L.map('reportMap', {
        center: [22.9734, 78.6569],
        zoom: 5,
        zoomControl: true
      });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(reportMapInstance);

      // Create layer groups for markers
      reportMarkersLayer = L.layerGroup().addTo(reportMapInstance);
      complaintMarkersLayer = L.layerGroup().addTo(reportMapInstance);

      // Add legend for report map
      const reportLegend = L.control({ position: 'bottomright' });
      reportLegend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML = `
          <h4>Map Markers</h4>
          <div class="marker-legend">
            <div class="marker-icon-small" style="background: #4CAF50; border-color: #2E7D32;"></div>
            <span>Verified Report</span>
          </div>
          <div class="marker-legend">
            <div class="marker-icon-small" style="background: #FFC107; border-color: #F57F17;"></div>
            <span>Pending Report</span>
          </div>
          <div class="marker-legend">
            <div class="marker-icon-small" style="background: #2196F3; border-color: #0D47A1;"></div>
            <span>Approved Complaint</span>
          </div>
          <div class="marker-legend">
            <div class="marker-icon-small" style="background: #F44336; border-color: #B71C1C;"></div>
            <span>Pending Complaint</span>
          </div>
        `;
        return div;
      };
      reportLegend.addTo(reportMapInstance);

      // Load report markers
      loadReportMarkers();
      // Load complaint markers
      loadComplaintMarkers();
    }

    function loadReportMarkers() {
      db.ref("reports").on("value", snapshot => {
        const data = snapshot.val();
        // Clear existing markers
        reportMarkersLayer.clearLayers();
        if (!data) return;

        Object.values(data).forEach(r => {
          const markerColor = r.status === "verified" ? "#4CAF50" : "#FFC107";
          const markerBorder = r.status === "verified" ? "#2E7D32" : "#F57F17";
          
          const customIcon = L.divIcon({
            className: 'custom-marker',
            html: `<div style="
              width: 20px;
              height: 20px;
              background: ${markerColor};
              border: 3px solid ${markerBorder};
              border-radius: 50%;
              box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            "></div>`,
            iconSize: [20, 20],
            iconAnchor: [10, 10],
            popupAnchor: [0, -12]
          });

          const marker = L.marker([r.lat, r.lng], { icon: customIcon })
            .bindPopup(`
              <strong>Comment:</strong> ${r.comment}<br>
              <strong>Guess:</strong> ${r.guessed}<br>
              <strong>Status:</strong> ${r.status}
            `);
          
          reportMarkersLayer.addLayer(marker);
        });
      });
    }

    function loadComplaintMarkers() {
      db.ref("complaints").on("value", snapshot => {
        const data = snapshot.val();
        // Clear existing markers
        complaintMarkersLayer.clearLayers();
        if (!data) return;

        Object.values(data).forEach(c => {
          if (!c.lat || !c.lng) return;
          
          const markerColor = c.status === "approved" ? "#2196F3" : "#F44336";
          const markerBorder = c.status === "approved" ? "#0D47A1" : "#B71C1C";
          
          const customIcon = L.divIcon({
            className: 'custom-marker',
            html: `<div style="
              width: 20px;
              height: 20px;
              background: ${markerColor};
              border: 3px solid ${markerBorder};
              border-radius: 50%;
              box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            "></div>`,
            iconSize: [20, 20],
            iconAnchor: [10, 10],
            popupAnchor: [0, -12]
          });

          const marker = L.marker([c.lat, c.lng], { icon: customIcon })
            .bindPopup(`
              <strong>Name:</strong> ${c.name || '-'}<br>
              <strong>Location:</strong> ${c.location || '-'}<br>
              <strong>Issue:</strong> ${c.issue}<br>
              <strong>Description:</strong> ${c.description}<br>
              <strong>Status:</strong> ${c.status}
            `);
          
          complaintMarkersLayer.addLayer(marker);
        });
      });
    }

    // --- Initialize everything ---
    window.onload = () => {
      loadReports();
      loadComplaints();
      setTimeout(() => {
        initHeatmap();
        initReportMap();
      }, 800);
    };

    // Handle window resize
    window.addEventListener('resize', () => {
      if (heatmapMap) heatmapMap.invalidateSize();
      if (reportMapInstance) reportMapInstance.invalidateSize();
    });
  </script>
</body>
</html>
